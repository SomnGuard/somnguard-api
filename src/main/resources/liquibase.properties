# Liquibase configuration for Maven plugin
# Environment-specific values should be provided via environment variables or .env files

driver=org.postgresql.Driver
url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:somnguard}
username=${DB_USER:somnguard}
password=${DB_PASSWORD:somnguard}

changeLogFile=src/main/resources/db/changelog/db.changelog-master.yaml
classpath=target/classes

# Contexts and labels for selective execution
contexts=${LIQUIBASE_CONTEXTS:}
labels=${LIQUIBASE_LABELS:}

# Output
verbose=true
logLevel=INFO
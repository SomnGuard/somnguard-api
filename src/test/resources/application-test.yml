spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  liquibase:
    enabled: false
  mail:
    host: localhost
    port: 1025
    username: test@somnguard.local
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000
  sql:
    init:
      mode: never

MAIL_FROM: noreply@somnguard.local

app:
  jwt:
    public-key-location: classpath:keys/test/public.pem
    private-key-location: classpath:keys/test/private.pem
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    issuer: somnguard-api-test

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS security\;CREATE SCHEMA IF NOT EXISTS parameterization\;CREATE SCHEMA IF NOT EXISTS device_management\;CREATE SCHEMA IF NOT EXISTS telemetry_service\;CREATE SCHEMA IF NOT EXISTS monitoring\;CREATE SCHEMA IF NOT EXISTS analytics\;CREATE DOMAIN IF NOT EXISTS TIMESTAMPTZ AS TIMESTAMP WITH TIME ZONE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  liquibase:
    enabled: false
  sql:
    init:
      mode: never

app:
  email:
    brevo:
      # Dummy no secreto: los tests unitarios mockean el HTTP, nunca llaman a Brevo.
      api-key: test-dummy-key
  jwt:
    public-key-location: classpath:keys/test/public.pem
    private-key-location: classpath:keys/test/private.pem
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    issuer: somnguard-api-test

spring:
  application:
    name: somnguard-api-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  liquibase:
    enabled: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.somnguard: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    public-key-location: classpath:keys/test/public.pem
    private-key-location: classpath:keys/test/private.pem
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
    issuer: somnguard-api-test
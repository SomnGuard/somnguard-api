version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: somnguard-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-somnguard}
      POSTGRES_USER: ${DB_USER:-somnguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-somnguard}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-somnguard} -d ${DB_NAME:-somnguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - somnguard-network
    restart: unless-stopped


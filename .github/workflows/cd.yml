name: CD

on:
  push:
    branches: [develop, qa, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - develop
          - qa
          - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/qa' && 'qa' || 'development' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env=main" >> $GITHUB_OUTPUT
            echo "profile=main" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/qa" ]]; then
            echo "env=qa" >> $GITHUB_OUTPUT
            echo "profile=qa" >> $GITHUB_OUTPUT
          else
            echo "env=develop" >> $GITHUB_OUTPUT
            echo "profile=develop" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/somnguard-api:${{ steps.env.outputs.env }}

      - name: Deploy to ${{ steps.env.outputs.env }}
        run: |
          echo "Deploying to ${{ steps.env.outputs.env }} environment..."
          # Add deployment commands here (kubectl, docker-compose, etc.)
          # Example for docker-compose:
          # docker compose --env-file .env.${{ steps.env.outputs.env }} up -d

      - name: Run migrations
        run: |
          echo "Running Liquibase migrations for ${{ steps.env.outputs.env }}..."
          # Example:
          # docker run --rm \
          #   -e DB_HOST=${{ secrets.DB_HOST }} \
          #   -e DB_PORT=${{ secrets.DB_PORT }} \
          #   -e DB_NAME=${{ secrets.DB_NAME }} \
          #   -e DB_USER=${{ secrets.DB_USER }} \
          #   -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
          #   ${{ secrets.DOCKERHUB_USERNAME }}/somnguard-api:${{ steps.env.outputs.env }} \
          #   mvn liquibase:update -Dspring-boot.run.profiles=${{ steps.env.outputs.profile }}

      - name: Health check
        run: |
          echo "Waiting for health check..."
          # Add health check logic
          sleep 10
          curl -f http://${{ steps.env.outputs.env }}.somnguard.local/actuator/health/liveness || exit 1

      - name: Notify
        if: always()
        run: |
          echo "Deployment to ${{ steps.env.outputs.env }} completed with status: ${{ job.status }}"
          # Add notification (Slack, Teams, email)